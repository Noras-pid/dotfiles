active = "#9ccfff"
hover = "#e66a7d"
warning = "#d6c791"
critical = "#e66a7d"

grey0 = "#34475d"
grey1 = "#667990"
grey2 = "#92a5bb"

red = "#e66a7d"
orange = "#e6a27d"
yellow = "#d6c791"
green = "#95d5a7"
aqua = "#8bd6ef"
blue = "#9ccfff"
purple = "#c0a8df"

