## MangoHud for games started with `mangohud %command%` (or gamemoderun mangohud %command%).
## Hidden until Shift+F12; Shift+F11 cycles position. Colours: Orrery "rei".

no_display
toggle_hud=Shift_L+F12
toggle_hud_position=Shift_L+F11
position=top-left
round_corners=6
background_alpha=0.55
background_color=0b1022
font_size=19
text_color=e1e9f4
text_outline
hud_compact

fps
fps_color_change
fps_value=30,55
fps_color=e66a7d,d6c791,95d5a7
frametime
frame_timing
frametime_color=9ccfff

cpu_stats
cpu_temp
cpu_mhz
cpu_color=9ccfff
cpu_load_change
cpu_load_value=60,90
cpu_load_color=e1e9f4,d6c791,e66a7d

gpu_stats
gpu_temp
gpu_core_clock
gpu_name
gpu_color=c0a8df
gpu_load_change
gpu_load_value=60,90
gpu_load_color=e1e9f4,d6c791,e66a7d

vram
vram_color=8bd6ef
ram
ram_color=95d5a7

engine_color=9caec5
wine
