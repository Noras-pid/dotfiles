# drop-in: retry a failed apply a few times, then stop instead of looping forever.
# The base unit in ~/.config/systemd/user/ is overwritten by
# `autostart.py refresh`; this file is not. Steam no longer races the worker
# (rei_user.lua starts it through steam-after-profile.sh), so a failure here is
# a real one and worth a bounded number of retries only.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=6

[Service]
Restart=on-failure
RestartSec=30
