# Rei Ayanami terminal — theme colours continue to follow Orrery.
include /home/noras/.config/orrery/current/kitty.conf
shell zsh
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
disable_ligatures cursor
cursor_shape beam
cursor_blink_interval 0
cursor_trail 0
background_opacity 0.96
dynamic_background_opacity yes
window_padding_width 18
window_margin_width 4
initial_window_width 110c
initial_window_height 30c
remember_window_size no
scrollback_lines 20000
wheel_scroll_multiplier 3
enable_audio_bell no
visual_bell_duration 0
confirm_os_window_close 0
shell_integration enabled
detect_urls yes
url_color #8bd6ef
url_style curly
copy_on_select no
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template " {index}  {title} "
active_tab_foreground #0b1022
active_tab_background #9ccfff
active_tab_font_style bold
inactive_tab_foreground #9caec5
inactive_tab_background #17243a
tab_bar_background #0b1022
map ctrl+c copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+f kitten hints --type=url
map ctrl+shift+g show_last_command_output
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Navigate splits and previous command output.
enabled_layouts tall,stack,splits
window_border_width 1
active_border_color #9ccfff
inactive_border_color #293b55
map ctrl+shift+space next_layout
map ctrl+shift+j scroll_to_prompt -1
map ctrl+shift+k scroll_to_prompt 1
