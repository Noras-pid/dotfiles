; Feral GameMode for this laptop (i5-7300HQ, Intel HD 630 drives the screen,
; GTX 1050 renders games through PRIME). Active while a game launched with
; `gamemoderun %command%` runs; `gamemoded -s` shows the state.

[general]
desiredgov=performance
defaultgov=powersave
; the iGPU only composites the desktop here: never trade CPU clocks for it
igpu_desiredgov=performance
igpu_power_threshold=-1
softrealtime=auto
renice=10
ioprio=0
inhibit_screensaver=1
disable_splitlock=1

[cpu]
; 4 threads, no hybrid cores: nothing to park or pin
park_cores=no
pin_cores=no

[custom]
; the compositor runs on the same iGPU that shows the game's frames:
; pause animations and shadows for the game, restore the configured look after.
; Turbo is kept on all the time by turbo-unlock.service, so it is not touched here
; (the old `turbo-unlock off` on end switched turbo off after every game).
; power-profiles-daemon is disabled on this machine: no powerprofilesctl.
start=hyprctl eval 'hl.config({ animations = { enabled = false }, decoration = { shadow = { enabled = false } } })'
    notify-send -a GameMode -i input-gaming "GameMode on" "Desktop effects paused"
end=hyprctl reload
    notify-send -a GameMode -i input-gaming "GameMode off"
script_timeout=10
