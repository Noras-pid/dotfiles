[Service]
# pin the dGPU and its root port to D0 first: once the driver is gone, runtime PM
# would drop them into D3cold, and the firmware poweroff path hangs on that
ExecStop=
ExecStop=-/usr/bin/sh -c 'for d in 0000:00:01.0 0000:01:00.0 0000:01:00.1; do echo on > /sys/bus/pci/devices/$d/power/control; done; echo "nvidia users: $(fuser /dev/nvidia* 2>/dev/null)"; modprobe -r nvidia_drm nvidia_modeset nvidia_uvm nvidia && echo "nvidia unloaded, dGPU $(cat /sys/bus/pci/devices/0000:01:00.0/power/runtime_status)" || { echo "nvidia unload failed:"; lsmod | grep ^nvidia; }'
